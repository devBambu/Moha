name: iOS CI

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    name: Build & Test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & Test
        run: |
          xcodebuild \
            -project Moha.xcodeproj \
            -scheme Moha \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5'
            clean test